<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — {{ COMPANY }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <form class="admin-login" method="post" action="{{ url_for('admin_login', next=next) }}">
    <p class="eyebrow center">Administration</p>
    <h1 class="admin-login-title">TERY-EMBALLAGE</h1>

    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <div class="field">
      <label for="email">Courriel</label>
      <input type="email" id="email" name="email" required
             value="{{ form.get('email','') if form else '' }}" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-dark btn-block">Se connecter</button>
    <p class="admin-login-back"><a href="{{ url_for('index') }}">Retour à la boutique</a></p>
  </form>
</div>

</body>
</html>
